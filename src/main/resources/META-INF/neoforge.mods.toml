modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
credits=""
authors=""
description='''
Settlement Pressure (定居点压力) — a dynamic threat framework.

A base is defined not by block type, but by player-placed blocks and their
adjacency. The more you terraform and build, the greater the outer threat
once the base is active. Bases only activate while an online player is inside
a base chunk. Pressure applies only to a base's safe zone and outer zone.
Lone wolves, new players, and players outside any base keep a low 1~3 mob rule.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
    config="${mod_id}.mixins.json"
